# Stil 2 — yayma (docs/SALDIRI-STILI.md). Emre'nin elle 10 saldırısından çıkarıldı (kayıt X:\CoC\kayit\20261101_185832,
# 01.11 19:12–19:27). Ordu: 60 süper barbar, kuşatma, King · Queen · Warden · Royal Champion, 11 yarasa büyüsü.
# Süreler saniye; [a, b] = her seferinde a ile b arasında rastgele; 0,6 gibi tek sayılar = olasılık.
# Adımların anlamı ve yeni stil yazmak: docs/STIL-YAZMA.md

steps:
  - lead: {first: true}   # Champion önce (panel "Champion barbarlardan önce, %" kadar saldırıda), değilse aşağıdaki lead'de
  - troops                # kırmızı alanı okut, dört kenara sürükle, kalanları tek tek
  - lead                  # Champion + yetenek (önce inmediyse)
  - heroes                # kuşatma + kahramanlar aynı noktaya
  - spells                # yarasalar kahramanların noktasına
  - retry                 # inmeyenler bir daha, biraz dışarıdan

card_to_drop: [0.15, 0.35] # karta bastıktan sonra sahaya dokunmadan önce (Emre 20:55: daha hızlı)

troops:
  card: super_barbarian
  mode: emre               # Emre 02.11: kendi kaydettiği 4 tam tur (assets/emre_strokes.json, kayıt 23:33), her seferinde başka biri,
                           # aynalanmış / döndürülmüş, kırmızı çizgiye oturtulmuş; "drag" = eski dört kenar sürüklemesi
  margin: [0.01, 0.016]    # emre: yay kırmızı çizginin bu kadar dışından (ekran genişliği payı) + Emre'nin el titremesi
  wobble: [0.3, 0.6]       # emre: el titremesinin ne kadarı
  plan_share: [1.0, 1.15]  # emre: yayların süresi 60 asker ÷ 7,3 × bu (kart erken biterse parmak kalkar)
  start_cycle: [180, 0, 270] # emre: Emre 02.11 tam tur fikri — başlangıç sırayla sol, sağ, üst (±12°), yön bir saat yönü bir ters
  steer: {out: 0.004, in: 0.004, max_out: 0.015, max_in: 0.008, every: 0.3} # emre: uyarı varken dışarı, asker inmiyorken içeri
  count: 60
  per_second: 7.3          # basılı tutunca inen asker (kayıttan ölçüldü: 1,5 sn'de ~11)
  hold_share: [0.9, 0.96]  # sürükleme kartın bitmesinden biraz önce biter; kalan 2–6 barbar tek tek (Emre de böyle)
  per_side: [13, 15]       # Emre 22:53: dört kenarın her birine 13–15, kenar başına kısa sürükleme; önce üst iki, sonra görüntü yukarı → alt iki (yoksa aşağıdaki halves / pan)
  halves: 0.7              # 10 saldırının 7'sinde iki yarım (üst + alt), 3'ünde tek tur
  sweep_pause: [0.25, 0.6] # iki yarım arası
  pan: 0.4                 # saldırıların bu kadarında Emre'nin W / S'si gibi: görüntüyü yukarı it, alt yarıyı sürükle, geri indir, üst yarıyı (Emre 1C)
  pan_by: 0.3              # kaydırma, ekran yüksekliğinin payı
  hold_still: [0.35, 0.55] # parmak önce kıpırdamadan durur, sonra yürür (Emre 0,36–0,53 sn; hemen yürüyen sürükleme görüntüyü kaydırır)

siege:
  card: siege
  first: 1.0               # Champion'dan sonra ilk o, kahramanlar arkasına (Emre 20:55)

heroes:
  lead: champion           # tek başına başka bir kenardan, yeteneği hemen
  lead_first: 0.0          # Emre 20:55: barbarlar → Champion + yetenek → kuşatma → 3 kahraman arkasına → yarasa, beklemeden
  group: [king, queen, warden, minion_prince]   # aynı noktaya, sırası rastgele; yükselmedeki kahraman çubukta yok, atlanır (02.11)
  gap: [0.25, 0.5]         # iki kart arası (Emre 20:55: daha hızlı)
  ability_now:             # inince hemen yetenek olasılığı
    champion: 1.0
    queen: 0.6
  ability_after:           # yoksa inişten bu kadar sonra (kayıttaki aralıklar)
    king: [4, 25]
    queen: [6, 30]
    warden: [10, 30]
    minion_prince: [6, 20]
    champion: [1, 3]

spells:
  card: bat
  count: 11
  on_heroes: 0.85          # kahramanların noktasına (10 saldırının 9'u), yoksa başka bir kenara
  gap: [0.12, 0.17]        # Emre ~0,15 sn'de bir basıyor

end:
  after_factor: [0.6, 1.05] # panel "Saldırıyı bitir" × bu (60 → 36–63 sn; Emre 29–65 sn'de teslim oldu)
  loot_left: [50000, 70000] # Emre 23:04: köyde kalan altın ve iksirin ikisi de bunun altına inince hemen teslim
  idle_seconds: 20          # ganimet bu kadar değişmezse savaşı bitir
  max_seconds: 180
