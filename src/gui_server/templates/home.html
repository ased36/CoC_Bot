<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoC Bot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
</head>
<body class="home">
    <div class="home-card card">
        <div class="brand">
            <img src="{{ url_for('static', filename='coc_bot_logo.png') }}" alt="">
            <div class="name"><b>CoC Bot</b><small>Kontrol paneli</small></div>
        </div>
        <p class="hint">Bir bot kopyası seçin ya da adını yazın (BlueStacks kopya adı, ör. <b>main</b>).</p>
        <form method="POST" class="custom-input-form">
            <input type="text" name="id" placeholder="Kopya adı" required title="Kopya adı" autofocus>
            <button type="submit" name="id" class="btn primary">Aç →</button>
        </form>
        <form class="stacked-buttons"></form>
    </div>

    <script>
        const ids = new Set({{ ids|default([])|tojson }});

        async function registerID(new_id) {
            try {
                const url = `/instance_action`;
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        action: "start",
                        id: new_id
                    })
                });
                const res = await response.json();
                if (res === 0) {
                    alert("Geçersiz kopya adı");
                    return false;
                } else {
                    return true;
                }
            } catch (error) {
                console.error('Error setting ID:', error);
            }
        }

        function updateInstances() {
            let i = 0;
            const ids_list = Array.from(ids);
            while (i < ids_list.length) {
                const id = ids_list[i];
                if (!document.getElementById(`id_${id}`)) {
                    const idButton = document.createElement("button");
                    idButton.type = "submit";
                    idButton.className = "btn";
                    idButton.id = `id_${id}`;
                    idButton.value = id;
                    idButton.innerHTML = `${id}`;
                    idButton.onclick = () => {
                        window.location.href = `/instances/${id}`;
                    };
                    document.querySelector(".stacked-buttons").appendChild(idButton);
                }

                i++;
            }
        }

        updateInstances();

        document.querySelectorAll("form").forEach(form => {
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                const submitter = e.submitter;
                const formData = new FormData(form);

                if (submitter.name === "id") {
                    const newID = formData.get("id").trim();
                    const valid = await registerID(newID);
                    if (!valid) return;
                    // ids.add(newID);
                    // updateInstances();
                    window.location.href = `/instances/${newID}`;
                }
                
                form.reset();
            });
        });
    </script>
</body>
</html>
